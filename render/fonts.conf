<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fontconfig for the headless Chromium on Railway: the fonts come from the nix packages in nixpacks.toml -->
<fontconfig>
  <dir>/root/.nix-profile/share/fonts</dir>
  <dir>/nix/var/nix/profiles/default/share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/app/render/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family><family>Noto Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
